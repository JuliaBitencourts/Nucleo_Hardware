<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Painel de Produtos - Núcleo Hardware</title>
  <link rel="stylesheet" href="painel.css">
  <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:700|IBM+Plex+Sans:400,500,600" rel="stylesheet">
</head>

<body>

  <!--CABEÇALHO-->
  <header class="menu">
        <div class="menu-interno">

            <a href="../inicio/index.html" class="logo" aria-label="Núcleo Hardware, início">
                <img src="../assets/img/Carrinho-selection.png" alt="" width="36" height="36">
                <span class="logo-texto">
                    <span class="logo-nome">Núcleo</span>
                    <span class="logo-sub">Hardware</span>
                </span>
            </a>

            <nav class="menu-links" aria-label="Principal">
                <a href="../inicio/index.html">Início</a>
                <a href="../inicio/index.html#produtos">Produtos</a>
                <a href="../inicio/index.html#sobre">Sobre</a>
            </nav>

            <div class="menu-acoes">
                 <a href="../login/login.html" id="sair">Sair</a>
            </div>

        </div>
    </header>

  <!--CONTEÚDO-->
  <main>
    <h1>Painel de Produtos</h1>

    <div class="conteudo">

      <!--PRODUTOS CADASTRADOS-->
      <section class="caixa produtos">
        <h2>Novo produto</h2>

        <div class="formulario">

          <label>Nome</label>
          <input type="text" id="nomeProduto" placeholder="Ex.: Memória DDR4 8 GB">

          <label>Categoria</label>
          <input type="text" id="categoriaProduto" placeholder="Ex.: Memória">

          <label>Preço (R$)</label>
          <input type="number" id="precoProduto" placeholder="0,00" step="0.01">

          <label>Estoque (unidades)</label>
          <input type="number" id="estoqueProduto" placeholder="0">

          <button class="adicionar" id="btnAdicionar" type="button">
            Adicionar produto
          </button>

        </div>
        <h2>Produtos cadastrados</h2>

        <table>
          <tr>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Ação</th>
          </tr>

          <tbody id="listaProdutos">
          </tbody>

        </table>
      </section>

      <!--RELATÓRIO-->
      <section class="caixa relatorio">
        <h2>Relatório</h2>

        <div class="item">
          <span>Produtos</span>
          <strong id="totalProdutos">0</strong>
        </div>

        <div class="item">
          <span>Unidades</span>
          <strong id="totalUnidades">0</strong>
        </div>

        <div class="item">
          <span>Estoque baixo</span>
          <strong id="estoqueBaixo">0</strong>
        </div>

        <div class="item">
          <span>Valor em estoque</span>
          <strong id="valorEstoque">0</strong>
        </div>
      </section>

    </div>
  </main>

  <script src="../js/localStorage.js" defer></script>
  <script src="painel.js" defer></script>

</body>

</html>
